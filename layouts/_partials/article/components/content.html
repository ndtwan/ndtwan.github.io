<section class="article-content">
    {{ if ge (len .TableOfContents) 100 }}
    <details class="inline-toc"><summary>Mục lục bài viết</summary>{{ .TableOfContents }}</details>
    {{ end }}
    {{ .Content }}
    {{ if in .Params.categories "Tản văn" }}
        {{ with site.GetPage "/categories/tản-văn" }}<nav class="prose-back"><a href="{{ .RelPermalink }}">← Về góc tản văn</a></nav>{{ end }}
    {{ end }}
</section>
